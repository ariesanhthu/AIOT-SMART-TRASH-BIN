spring.application.name=backend

firebase.credentials.path=secrets/serviceAccountKey.json

# Shared secret ESP32 firmware presents (header X-Provision-Secret) to
# /api/devices/{deviceId}/auth-token to obtain a Firebase custom token.
# Must be overridden via env var in every real deployment - left blank here
# so an unconfigured environment fails closed (see DeviceAuthService).
device.provisioning.secret=${DEVICE_PROVISIONING_SECRET:}

# ── Device JWT ─────────────────────────────────────────────────────────────────
# Secret used to sign the Device JWT issued to ESP32 firmware.
# Must be at least 32 characters. Override via env var in every real deployment.
device.jwt.secret=${DEVICE_JWT_SECRET:changeme-replace-in-production-min32chars}
device.jwt.expiry-seconds=${DEVICE_JWT_EXPIRY_SECONDS:86400}