$kind: http-request
name: '[PATCH] Cập nhật cấu hình thùng rác (ngưỡng + bảo trì)'
method: PATCH
url: 'http://localhost:8080/api/devices/STBIN_HCMUS_001/config'
order: 2500
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{bearerToken}}'
body:
  mode: raw
  raw: |
    {
      "thresholds": {
        "organic": 80,
        "paper": 80,
        "plastic": 80
      },
      "maintenanceMode": false
    }
