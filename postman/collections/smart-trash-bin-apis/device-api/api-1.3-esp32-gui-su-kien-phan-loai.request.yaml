$kind: http-request
name: 'API 1.3 - [ESP32] Gửi sự kiện phân loại (Ingest Event)'
method: POST
url: 'http://localhost:8080/api/devices/STBIN_HCMUS_001/events'
order: 400
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Bearer {{deviceToken}}'
body:
  mode: raw
  raw: |
    {
      "eventType": "CLASSIFY",
      "wasteType": "paper",
      "targetCompartment": "paper",
      "aiConfidence": 0.92,
      "fillPercent": {
        "organic": 42,
        "paper": 71,
        "plastic": 30
      },
      "alertThreshold": 80,
      "deviceTimestamp": "2026-07-24T12:00:00Z",
      "syncedLate": false,
      "firmwareVersion": "1.0.0",
      "aiModelVersion": "trashnet-tflite-v1.2",
      "imageUrl": "https://res.cloudinary.com/demo/image/upload/v1/esp32cam/evt_sample.jpg"
    }
